; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
lib_deps = 
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	dlloydev/QuickPID@^3.1.9
	dlloydev/sTune@^2.4.0
	mathertel/OneButton@^2.6.2
	https://github.com/Anush-DP/BigNumbers_I2C.git
	https://github.com/IowaScaledEngineering/arduino-thermocouple.git
